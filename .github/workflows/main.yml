
name: Generar APK Mi Primer Ciclo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir -p project
          unzip -q MiPrimerCiclo_V5.1_Navegacion_Corregida.zip -d project
          test -f project/settings.gradle.kts

      - name: Compilar APK
        run: gradle -p project assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiPrimerCiclo-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
